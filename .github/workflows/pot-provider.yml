# Builds the bgutil PO-token provider as a self-contained (deno-compiled) binary
# for each platform and uploads it as a workflow artifact. The binaries are then
# gzip-hosted on R2 (qooti-releases) and downloaded on demand by the desktop app
# (see src-tauri/src/pot_provider.rs) the first time YouTube needs a PO token.
#
# macOS's binary MUST be built on macOS (native `canvas` addon can't cross-compile
# from Windows), which is why this runs in CI. Trigger manually:
#   gh workflow run pot-provider.yml
# then download the artifacts and push them to R2 as:
#   qooti-pot-aarch64-apple-darwin.gz   (macOS, Apple Silicon)
#   qooti-pot-x86_64-pc-windows-msvc.gz (Windows)
#
# Pinned to bgutil 2.0.0 so the compiled server matches the bundled plugin version
# (src-tauri/pot-plugin, which reports bgutil:http-2.0.0).

name: PO-token provider

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Clone bgutil provider (pinned)
        shell: bash
        run: git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil

      - name: Install server deps (production only)
        shell: bash
        working-directory: bgutil/server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Compile self-contained provider binary
        shell: bash
        working-directory: bgutil/server
        run: deno compile -A --node-modules-dir=auto --output qooti-pot src/main.ts

      # Verify the WHOLE mac chain on a real Mac (the runner): the compiled binary
      # runs, the server answers, yt-dlp loads the plugin from ~/.config, and a real
      # PO token is fetched. This is how we know the macOS path actually works.
      - name: Verify mac chain (run provider + yt-dlp → PO token)
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: bgutil/server
        run: |
          echo "== codesign info =="; codesign -dv qooti-pot 2>&1 | head -3 || true
          echo "== can the compiled binary even start? =="
          ./qooti-pot & SRV=$!
          sleep 10
          echo "server ping:"; curl -s -m 3 -o /dev/null -w "  http=%{http_code}\n" http://127.0.0.1:4416/ping || echo "  server NOT reachable"
          echo "== install plugin into yt-dlp config dir (~/.config/yt-dlp/plugins) =="
          PLUG="$HOME/.config/yt-dlp/plugins/qooti-bgutil/yt_dlp_plugins/extractor"; mkdir -p "$PLUG"
          cp ../plugin/yt_dlp_plugins/extractor/getpot_bgutil.py ../plugin/yt_dlp_plugins/extractor/getpot_bgutil_http.py "$PLUG/"
          echo "== fetch yt-dlp_macos =="
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o ytdlp && chmod +x ytdlp
          echo "== [A] token minting with the app's exact client chain (web,web_embedded) =="
          ./ytdlp -v --simulate --extractor-args "youtube:player_client=web,web_embedded" "https://youtu.be/dQw4w9WgXcQ" 2>&1 \
            | grep -iE "Retrieved a .*PO Token|Generating a .*PO Token|Fetching .*PO Token|bgutil|Failed to|ERROR" | head -20 || true
          echo "== [B] is the token ATTACHED to the media URL? (grep resolved URL for pot=) =="
          ./ytdlp -g -f "18/best" --extractor-args "youtube:player_client=web,web_embedded" "https://youtu.be/dQw4w9WgXcQ" 2>/dev/null \
            | head -1 | grep -oE 'pot=[^&]{0,24}' && echo "  → PO token present in media URL ✓" || echo "  → no pot= in media URL ✗"
          kill $SRV 2>/dev/null || true
          echo "== verify done =="

      - name: Ad-hoc code-sign (macOS — re-sign cleanly for distribution)
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: bgutil/server
        run: |
          codesign --force --sign - --timestamp=none qooti-pot
          codesign -dv qooti-pot || true

      - name: gzip
        shell: bash
        working-directory: bgutil/server
        run: |
          BIN=qooti-pot
          [ -f qooti-pot.exe ] && BIN=qooti-pot.exe
          gzip -c "$BIN" > "qooti-pot-${{ matrix.target }}.gz"
          ls -la "qooti-pot-${{ matrix.target }}.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qooti-pot-${{ matrix.target }}
          path: bgutil/server/qooti-pot-${{ matrix.target }}.gz
          retention-days: 7
