<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qooti</title>
  <link rel="stylesheet" href="./styles/global.css" />
</head>
<body>

  <!-- Custom title bar — shown only on Windows via JS -->
  <div id="title-bar" class="title-bar" hidden>
    <span class="title-bar-name" data-tauri-drag-region>qooti</span>
    <div class="title-bar-controls">
      <button id="btn-minimize" class="tb-btn tb-minimize" aria-label="minimise"></button>
      <button id="btn-maximize" class="tb-btn tb-maximize" aria-label="maximise"></button>
      <button id="btn-close"    class="tb-btn tb-close"    aria-label="close"></button>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app-shell">

    <!-- Top navigation bar -->
    <header id="top-bar" class="top-bar" data-tauri-drag-region>

      <!-- Left: hamburger + logo (the same on every page) -->
      <div id="top-bar-left" class="top-bar-left">
        <button id="nav-drawer-toggle" class="top-bar-icon-btn" title="Menu" aria-label="Menu" data-i18n-title="nav.menu"></button>
        <a class="top-bar-brand" href="#" tabindex="-1">
          <img src="/assets/brand/lockup-white.svg" alt="qooti" class="top-bar-logo" draggable="false" />
        </a>
      </div>

      <!-- Center: search ring wrapper (ring lives here) + search bar inside -->
      <div class="search-ring-wrap" id="search-ring-wrap">

        <!-- Pages without search (Collections, Settings, inside a collection — guide D1/D2/I1):
             the page title takes the search bar's place (page-bar.js) -->
        <div class="page-bar-title" id="page-bar-title" hidden>
          <button class="page-bar-crumb" id="page-bar-crumb" hidden>
            <span class="icon icon-14" style="mask-image:url('/icons/arrow-left.svg');-webkit-mask-image:url('/icons/arrow-left.svg')" aria-hidden="true"></span>
            <span id="page-bar-crumb-label"></span>
          </button>
          <span class="page-bar-name" id="page-bar-name"></span>
          <span class="page-bar-count" id="page-bar-count" hidden></span>
        </div>

        <div class="top-bar-search-wrap">
          <button class="search-submit-btn" id="search-submit-btn" title="Search" aria-label="Search" data-i18n-title="nav.search"><span class="icon icon-16" style="mask-image:url('/icons/magnifying-glass.svg');-webkit-mask-image:url('/icons/magnifying-glass.svg')" aria-hidden="true"></span></button>
          <input class="top-bar-search" id="top-bar-search" placeholder="Search your library" autocomplete="off" spellcheck="false" />
          <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
          <span class="ring-label" id="ring-label" aria-live="polite"></span>
          <button class="cp-trigger" id="color-swatch-btn" title="Filter by color" aria-label="Filter by color" data-i18n-title="board.filter_color">
            <span class="icon-cp icon icon-16" aria-hidden="true"></span>
            <span class="icon-dl"><span class="icon icon-16" style="mask-image:url('/icons/download-simple.svg');-webkit-mask-image:url('/icons/download-simple.svg')" aria-hidden="true"></span></span>
            <span class="icon-cancel"><span class="icon icon-16" style="mask-image:url('/icons/x.svg');-webkit-mask-image:url('/icons/x.svg')" aria-hidden="true"></span></span>
          </button>
          <button class="media-filter-btn" id="media-filter-btn" title="Filter by type" aria-label="Filter by media type">
            <span class="icon icon-16" id="media-filter-icon" style="mask-image:url('/icons/funnel.svg');-webkit-mask-image:url('/icons/funnel.svg')" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Right: the page's action (Import in the library) + downloads + avatar -->
      <div id="top-bar-right" class="top-bar-right">
        <button id="top-bar-import-btn" class="top-bar-import-btn" data-i18n="action.import">Import</button>
        <button id="page-bar-action" class="page-bar-action" hidden></button>
        <!-- Download indicator — always visible -->
        <button id="dl-indicator-btn" class="top-bar-icon-btn dl-indicator" title="Downloads" data-i18n-title="dl.panel.title">
          <span class="dl-indicator-icon"></span>
          <span class="dl-indicator-badge" hidden>0</span>
        </button>
        <button id="top-bar-avatar" class="top-bar-avatar" title="Profile" aria-label="Profile" data-i18n-title="settings.section.profile">A</button>
      </div>

    </header>

    <!-- Main content -->
    <main id="main-content" class="main-content">
      <div id="view-grid"          class="view"></div>
      <div id="view-collections"   class="view" hidden></div>
      <div id="view-boards"        class="view" hidden></div>
      <div id="view-search"        class="view" hidden></div>
      <div id="view-milestones"    class="view" hidden></div>
      <div id="view-notifications" class="view" hidden></div>
      <div id="view-settings"      class="view" hidden></div>
      <div id="view-activity"      class="view activity-view" hidden></div>
      <div id="view-duplicates"    class="view" hidden></div>
    </main>

  </div>

  <!-- Nav drawer (toggled by hamburger) -->
  <div id="nav-drawer" class="nav-drawer">
    <div class="nav-drawer-backdrop" id="nav-drawer-backdrop"></div>
    <div class="nav-drawer-panel">
      <nav id="drawer-nav-primary"   class="nav-drawer-nav"></nav>
      <div class="nav-drawer-section" id="drawer-collections-section" hidden>
        <div class="nav-drawer-heading" data-i18n="nav.collections">Collections</div>
        <div class="nav-drawer-cols" id="drawer-collections"></div>
      </div>
      <div class="nav-drawer-spacer"></div>
      <div class="nav-drawer-storage" id="drawer-storage" hidden>
        <span class="nav-drawer-storage-text" id="drawer-storage-text"></span>
        <span class="nav-drawer-storage-bar"><span id="drawer-storage-fill"></span></span>
      </div>
      <nav id="drawer-nav-secondary" class="nav-drawer-nav"></nav>
    </div>
  </div>

  <!-- Overlay portal (modals, popovers, tooltips) -->
  <div id="overlays"></div>

  <!-- Onboarding layer -->
  <div id="onboarding-root" hidden></div>

  <!-- Splash screen -->
  <div id="splash" class="splash">
    <img class="splash-logo" src="/assets/brand/lockup-white.svg" alt="qooti" />
    <span class="splash-error" hidden></span>
  </div>

  <!-- Developer overlay (triggered by typing blt_developer in search) -->
  <div id="dev-overlay" class="dev-overlay" hidden></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
