[package]
name = "qooti"
version = "1.0.3"
description = "qooti — visual inspiration library"
authors = ["Bloot"]
edition = "2021"

[lib]
name = "qooti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-shell  = "2"
tauri-plugin-fs     = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater   = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite   = { version = "0.31", features = ["bundled"] }

uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["clock"] }
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2       = "0.10"
hex        = "0.4"
anyhow     = "1"
once_cell  = "1"
tiny_http  = "0.12"
base64     = "0.22"
ureq       = "2"
flate2     = "1"
arboard    = { version = "3", features = ["image-data"] }
# AI image enhancer/upscaler. onnxruntime is statically linked (download-binaries),
# so nothing extra ships as a loose file. GPU execution providers are added per-OS
# below (CoreML / DirectML); both fall back to CPU automatically.
ort        = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
log        = "0.4"
env_logger = "0.11"
zip        = "0.6"
infer      = "0.15"
qrcode       = { version = "0.14", default-features = false }
urlencoding  = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg     = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
ort        = { version = "=2.0.0-rc.10", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
ort  = { version = "=2.0.0-rc.10", features = ["coreml"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
