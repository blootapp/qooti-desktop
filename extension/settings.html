<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qooti</title>
  <link rel="icon" href="icons/icon-48.png" />
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>

  <header class="topbar">
    <img src="icons/ui/lockup.svg" alt="qooti" class="topbar-logo" width="68.33" height="20" />
  </header>

  <main class="page">
    <h1 class="page-title" data-i18n="set.title"></h1>

    <section class="section" id="connection">
      <h2 class="section-title" data-i18n="set.connection"></h2>
      <div class="group">
        <div class="row row--app">
          <span class="status-dot" id="status-dot"></span>
          <span class="row-text">
            <span class="row-title"><span data-i18n="set.app"></span> <span class="row-meta" id="app-version"></span></span>
            <span class="row-sub" id="app-status"></span>
          </span>
          <button type="button" class="btn btn--secondary" id="btn-app" hidden></button>
        </div>
      </div>
    </section>

    <!-- Free only: today's downloads from the browser and the way to Pro (same card as
         the popup's) -->
    <section class="section" id="plan-section" hidden>
      <h2 class="section-title" data-i18n="set.plan"></h2>
      <div class="plan plan--page" id="set-plan">
        <div class="plan-top">
          <span class="plan-title" data-i18n="plan.free"></span>
          <span class="plan-pill" data-i18n="plan.limit_reached" hidden></span>
        </div>
        <div class="plan-usage">
          <div class="plan-track"><div class="plan-fill"></div></div>
          <div class="plan-labels"><span class="plan-used"></span><span class="plan-left"></span></div>
        </div>
        <p class="plan-note" data-i18n="plan.midnight" hidden></p>
        <button type="button" class="btn btn--upgrade plan-upgrade" data-i18n="common.upgrade"></button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="set.saving"></h2>
      <div class="group">
        <button type="button" class="row row--toggle" id="toggle-picker" role="switch" aria-checked="true">
          <span class="row-text">
            <span class="row-title" data-i18n="set.picker"></span>
            <span class="row-sub" data-i18n="set.picker.sub"></span>
          </span>
          <span class="toggle" aria-hidden="true"></span>
        </button>
        <div class="divider"></div>
        <button type="button" class="row row--toggle" id="toggle-progress" role="switch" aria-checked="true">
          <span class="row-text">
            <span class="row-title" data-i18n="set.progress"></span>
            <span class="row-sub" data-i18n="set.progress.sub"></span>
          </span>
          <span class="toggle" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="set.button"></h2>
      <div class="group">
        <div class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="set.hidden"></span>
            <span class="row-sub" id="sites-sub"></span>
          </span>
          <span class="row-value" id="sites-count"></span>
        </div>
        <form class="row row--add" id="site-form" novalidate>
          <label class="input" id="site-field">
            <span class="icon icon--link"></span>
            <input type="text" id="site-input" data-i18n-ph="set.hidden.add_ph" data-i18n-aria="set.hidden.add_aria"
                   autocomplete="off" autocapitalize="off" spellcheck="false" />
          </label>
          <button type="submit" class="btn btn--secondary" data-i18n="set.hidden.add"></button>
        </form>
        <p class="field-note" id="site-note" role="status" hidden></p>
        <!-- Small chips, newest first, two lines at most (settings.js) -->
        <div class="chips" id="site-chips" hidden></div>
      </div>
    </section>

    <section class="section" id="signin">
      <h2 class="section-title" data-i18n="set.signin"></h2>
      <div class="group">
        <button type="button" class="row row--toggle" id="toggle-signin" role="switch" aria-checked="false">
          <span class="row-text">
            <span class="row-title" data-i18n="set.signin.row"></span>
            <span class="row-sub" data-i18n="set.signin.sub"></span>
          </span>
          <span class="toggle" aria-hidden="true"></span>
        </button>
      </div>
      <p class="section-note" id="signin-note" data-i18n="set.signin.denied" hidden></p>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="set.language"></h2>
      <div class="segmented" role="radiogroup" id="lang" data-i18n-aria="set.language">
        <button type="button" role="radio" data-lang="auto" data-i18n="set.lang.auto"></button>
        <button type="button" role="radio" data-lang="en" lang="en" data-i18n="set.lang.en"></button>
        <button type="button" role="radio" data-lang="uz" lang="uz" data-i18n="set.lang.uz"></button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title" data-i18n="set.about"></h2>
      <div class="group">
        <div class="row">
          <span class="row-title" data-i18n="set.version"></span>
          <span class="row-value" id="ext-version"></span>
        </div>
        <div class="divider"></div>
        <a class="row row--link" id="link-privacy" target="_blank" rel="noopener">
          <span class="row-title" data-i18n="set.privacy"></span>
          <span class="icon icon--out"></span>
        </a>
        <div class="divider"></div>
        <a class="row row--link" id="link-help" target="_blank" rel="noopener">
          <span class="row-title" data-i18n="set.help"></span>
          <span class="icon icon--out"></span>
        </a>
      </div>
    </section>
  </main>

  <!-- Every hidden site on one page, with a search field: opened from "+N more" when
       there are more than 20 (fewer open in place, in the card) -->
  <div class="sheet" id="sites-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <header class="topbar">
      <button type="button" class="btn btn--ghost sheet-back" id="sheet-close" data-i18n-title="set.back">
        <span class="icon icon--back"></span><span data-i18n="common.settings"></span>
      </button>
    </header>
    <div class="page">
      <div class="sheet-head">
        <h1 class="page-title" id="sheet-title" data-i18n="set.hidden"></h1>
        <div class="sheet-meta">
          <span class="sheet-sub" id="sheet-sub"></span>
          <span class="row-value" id="sheet-count"></span>
        </div>
      </div>
      <label class="input input--tall">
        <span class="icon icon--search"></span>
        <input type="text" id="sheet-search" data-i18n-ph="set.hidden.find" data-i18n-aria="set.hidden.find"
               autocomplete="off" autocapitalize="off" spellcheck="false" />
      </label>
      <div class="chips chips--all" id="sheet-chips"></div>
      <p class="sheet-empty" id="sheet-empty" hidden></p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="pages.js"></script>
  <script src="settings.js"></script>
</body>
</html>
