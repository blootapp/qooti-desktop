<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qooti</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="header">
    <img src="icons/ui/lockup.svg" alt="qooti" class="header-logo" width="54.6649" height="16" />
    <span class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text" data-i18n="status.checking"></span>
    </span>
    <button type="button" class="icon-btn" id="btn-settings" data-i18n-title="common.settings"><span class="icon icon--settings"></span></button>
  </header>

  <main class="content">

    <!-- The app isn't running -->
    <section class="state" id="closed" hidden>
      <p class="state-title" data-i18n="offline.title"></p>
      <p class="state-text" id="closed-text" data-i18n="popup.closed.text"></p>
      <div class="state-actions">
        <button type="button" class="btn btn--primary" id="btn-open" data-i18n="common.open_qooti"></button>
        <a class="btn btn--ghost" id="link-get" target="_blank" rel="noopener" data-i18n="popup.get_qooti"></a>
      </div>
    </section>

    <!-- Connecting: qooti asks "Connect your browser?" first -->
    <section class="state" id="pairing" hidden>
      <p class="state-title" id="pairing-title"></p>
      <p class="state-text" id="pairing-text"></p>
      <div class="state-actions" id="pairing-actions" hidden>
        <button type="button" class="btn btn--primary" id="btn-connect" data-i18n="popup.connect_again"></button>
      </div>
    </section>

    <!-- Ready: the collection picker, this site's Ban / Unban, the Free plan -->
    <section class="ready" id="ready" hidden>
      <div class="group">
        <button type="button" class="row row--toggle" id="toggle-picker" role="switch" aria-checked="true">
          <span class="row-text">
            <span class="row-title" data-i18n="set.picker"></span>
            <span class="row-sub" data-i18n="set.picker.sub"></span>
          </span>
          <span class="toggle" aria-hidden="true"></span>
        </button>
      </div>
      <button type="button" class="btn btn--secondary btn--block" id="btn-ban" hidden></button>
      <p class="hint" id="hint"></p>
      <!-- Free plan: today's downloads from the browser, and the way to Pro -->
      <div class="plan" id="plan" hidden>
        <div class="plan-top">
          <span class="plan-title" data-i18n="plan.free"></span>
          <span class="plan-pill" data-i18n="plan.limit_reached" hidden></span>
        </div>
        <div class="plan-usage">
          <div class="plan-track"><div class="plan-fill"></div></div>
          <div class="plan-labels"><span class="plan-used"></span><span class="plan-left"></span></div>
        </div>
        <p class="plan-note" data-i18n="plan.midnight" hidden></p>
        <button type="button" class="btn btn--upgrade btn--block plan-upgrade" data-i18n="common.upgrade"></button>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span class="footer-version" id="footer-version"></span>
    <button type="button" class="btn btn--ghost" id="btn-open-footer" data-i18n="common.open_qooti" hidden></button>
  </footer>

  <script src="i18n.js"></script>
  <script src="pages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
